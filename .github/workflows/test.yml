name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run logic tests
        run: node tests/logic.test.mjs
      - name: Run blur tests
        run: node tests/blur.test.mjs
